training:
  batch_size: 128
  lr: 0.001
  epochs: 30
  num_workers: 4
  dropout: 0.5
  num_classes: 10
  data_root: "data/UrbanSound8K"
  save_dir: "saved_models"

preprocessing:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 512
  n_mels: 64
  target_samples: 66048
  n_time_frames: 128

model:
  architecture: UrbanSoundCNN
  conv_filters: [32, 64, 128]
  kernel_size: 3
  fc_units: 256

attacks:
  eval_epsilons: [0.01, 0.03, 0.1]  
  fgsm:
    epsilon: 0.03    
    adv_ratio: 0.5
  bim:
    epsilon: 0.03  
    adv_ratio: 0.5
    train_steps: 7 
    eval_steps: 10 

finetune:
  epochs: 10
  lr: 0.0001

vggish:
  # Preprocessing
  # target_samples = (96-1)*512 + 1024 = 49664  → exactly 96 time frames
  # "4 seconds" (88200 samples) in the algorithm spec is inconsistent with the
  # [1,64,96] shape requirement. 49664 is the only correct value.
  target_samples:  49664
  n_time_frames:   96
  n_mels:          64            # same as CNN

  # Dataloader
  batch_size:      128           # matches CNN exactly
  num_workers:     4

  # Optimiser
  lr:              0.001         # matches CNN exactly
  weight_decay:    1.0e-4        # L2 regularisation (CNN has none)

  # Training loop
  num_classes:     10
  dropout:         0.5
  epochs:          50            # more epochs than CNN (30) due to deeper model

  # LR scheduler — ReduceLROnPlateau
  lr_scheduler_factor:   0.5
  lr_scheduler_patience: 5       # epochs with no val-loss improvement before LR drop

  # Early stopping
  early_stop_patience:   15      # epochs with no val-acc improvement before stop

  # Validation split (taken from train folds, not a separate fold)
  val_fraction:    0.1           # 10 % of train data held out for val/early-stop

  # Paths
  save_dir:        "saved_models/vggish/normal"

crnn:
  # Preprocessing: same TARGET_SAMPLES as CNN — no new transform needed.
  # target_samples = (128-1)*512 + 1024 = 66048  → exactly 128 time frames
  # Input shape: [1, 64, 128] (identical to CNN)

  # Dataloader
  batch_size:     128            # matches CNN exactly
  num_workers:    4

  # Optimizer — no weight_decay (matches CNN; VGGish uses 1e-4)
  lr:             0.001

  # Training loop
  num_classes:    10
  dropout:        0.5
  epochs:         50             # more epochs than CNN (30) due to GRU convergence

  # LR scheduler — ReduceLROnPlateau (same as VGGish)
  lr_scheduler_factor:   0.5
  lr_scheduler_patience: 5

  # Early stopping
  early_stop_patience:   15      # epochs with no val-acc improvement before stop

  # Validation split (taken from train folds, not a separate fold)
  val_fraction:   0.1            # 10 % of train data held out for val/early-stop

  # Paths
  save_dir:       "saved_models/crnn/normal"
